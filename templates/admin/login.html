{% extends "admin/base.html" %}
{% block title %}登录 · 研友管理后台{% endblock %}
{% block guest %}
<div class="login-wrap">
  <div class="card login-card">
    <h1 class="display">管理后台</h1>
    <p class="caption mt-8">研友 Admin</p>
    <form method="post" class="mt-32">
      <input class="field" name="password" type="password" placeholder="管理员密码" autocomplete="current-password">
      {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
      <button type="submit" class="btn btn-primary mt-24" style="width:100%">进入后台</button>
    </form>
    <p class="caption mt-16" style="text-align:center"><a href="{{ url_for('auth.login') }}">返回网站</a></p>
  </div>
</div>
{% endblock %}
